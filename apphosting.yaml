# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
#
# Grape runs as one App Hosting backend: the Next.js server (pages, API
# routes, the ingest endpoint the tracking snippet posts to). Its data is
# Firestore and its sign-in is Firebase Authentication, both in the same
# project, reached with the backend's own service account — so there is no
# database URL, token or service-account key to configure here at all.

runConfig:
  # A crawl can launch Chromium (see src/core/context/render.ts), which
  # needs the memory; the rest of Grape is light.
  cpu: 1
  memoryMiB: 1024
  # 0 lets an idle Grape cost nothing. The first request after idling waits
  # for a cold start — the scheduled loop included, which is fine.
  minInstances: 0
  maxInstances: 2
  # Nothing runs after a response has gone out: Cloud Run only promises CPU
  # to requests in flight, so a crawl runs inside a request of its own
  # (api/products/[id]/setup) and the weekly loop inside the scheduler's.
  concurrency: 20

env:
  # Encrypts each account's AI API keys in Firestore. Required. Create it once
  # with `firebase apphosting:secrets:set GRAPE_ENCRYPTION_KEY` (any long
  # random value); changing it later makes every stored API key unreadable.
  - variable: GRAPE_ENCRYPTION_KEY
    secret: GRAPE_ENCRYPTION_KEY

  # The bearer token the weekly loop's scheduled function presents to
  # POST /api/cron/tick (functions/index.js). Same secret, granted to both.
  - variable: GRAPE_CRON_SECRET
    secret: GRAPE_CRON_SECRET

  # The Firebase web app's config, which the sign-in forms need in the
  # browser. App Hosting fills this in itself only for a backend that has a
  # web app linked to it; setting it here works either way. Not a secret: a
  # web apiKey names the project, it authorizes nothing (see
  # server/auth/firebase-web.ts). From `firebase apps:sdkconfig WEB <appId>`.
  - variable: FIREBASE_WEBAPP_CONFIG
    value: '{"apiKey":"AIzaSyAQxDD9ybxBzjoEYL83OuSLCFupdGEZSuE","authDomain":"grape-growth-os.firebaseapp.com","projectId":"grape-growth-os","appId":"1:19567237661:web:f2d81c1b0f003214e5c4f4"}'
    availability:
      - RUNTIME

  # Which AI service to use; each account then adds its own key from
  # /account. Leave as "" to start with AI off.
  - variable: LLM_PROVIDER
    value: "anthropic"
    availability:
      - RUNTIME

  # Anything but the exact string "false" keeps practice mode on: approving
  # an X post records it without sending. Can also be switched from /settings.
  - variable: GRAPE_ACTION_DRY_RUN
    value: "true"
    availability:
      - RUNTIME

  # Posting to X for real needs your own X app's credentials, as secrets.
  # Uncomment after `firebase apphosting:secrets:set X_CONSUMER_KEY` etc.
  # - variable: X_CONSUMER_KEY
  #   secret: X_CONSUMER_KEY
  # - variable: X_CONSUMER_SECRET
  #   secret: X_CONSUMER_SECRET
  # - variable: X_ACCESS_TOKEN
  #   secret: X_ACCESS_TOKEN
  # - variable: X_ACCESS_TOKEN_SECRET
  #   secret: X_ACCESS_TOKEN_SECRET
  # - variable: X_BEARER_TOKEN
  #   secret: X_BEARER_TOKEN

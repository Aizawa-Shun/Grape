name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what this project is developed on today; 22 is where it is
        # going. Testing only the newer one lets a dependency that needs 22
        # (jsdom 30 did) pass CI and break the machine the code is written on.
        node: [20, 22]
    env:
      # AI is opt-in and each account brings its own API key (see env.ts), so
      # CI simply runs with none configured — nothing in this job
      # calls a model, and the tests that exercise LLM-dependent code mock the
      # provider directly rather than constructing a real one.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # playwright is a dependency but its browser download is not needed: the
      # import in render.ts is lazy and soft-fails, and nothing here crawls.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: pnpm lint

      - run: pnpm typecheck

      # The Firestore and Auth emulators run on Java. With them up, the store
      # contract test (src/db/store/contract.test.ts) holds the in-memory
      # store and real Firestore to the same behaviour — the check that every
      # other test's in-memory store is telling the truth.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm test:emulators

      - run: pnpm build

# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The database is Turso (libsql:// over the network) rather than a disk on
# this service. Render's own disks cost money and, being local to one
# instance, still lose everything if the service is ever recreated instead of
# redeployed; Turso has a free tier and the same `@libsql/client` driver
# already in use, so this changes only two environment variables below, not
# the 51 database call sites, the 8 cascade deletes, or the migration history
# that /api/health verifies.
#
# Left for Render to fill in (see `sync: false` below): DATABASE_AUTH_TOKEN is
# required; LLM_PROVIDER is optional — AI is opt-in, so a deploy with it unset
# still works. There is no API key to set here at all: each account brings its
# own from /account once signed in (see core/auth/users.ts), so an Anthropic or
# OpenAI key belongs to a person, never to this blueprint.

services:
  - type: web
    name: grape
    runtime: node
    region: singapore

    # Free is viable now that the database is not on this instance's own disk:
    # a free instance spins down when idle and loses its container filesystem
    # on every restart, which used to take grape.db with it. Turso is outside
    # that filesystem, so restarts and spin-downs no longer lose data — the
    # cost of free is only that a spun-down instance's scheduled loop and any
    # request both wait for a cold start.
    plan: free

    # --prod=false because `pnpm db:migrate` runs tsx, and tsx is a
    # devDependency. A production-only install would leave the start command
    # with no way to apply migrations.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build

    # Migrations run here rather than in buildCommand or preDeployCommand:
    # those ran on a machine that could not reach the disk back when the
    # database was local, and now that it is Turso there is no reason to move
    # this off the one place already proven to work. drizzle's migrator
    # records what it has applied, so running on every boot is a no-op after
    # the first.
    startCommand: pnpm db:migrate && pnpm start

    # Public, and cheap for an unauthenticated caller: with no session cookie
    # /api/health checks the database and returns, skipping the model probe.
    # A health check that woke the LLM every minute would bill for uptime.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # A libsql://…-turso.io URL from `turso db show <name>`. Not the
      # file:/var/data/grape.db this used to be — that path lived on the disk
      # this blueprint no longer requests, and would now resolve to a plain
      # file inside the container that a restart throws away.
      - key: DATABASE_URL
        sync: false

      # From `turso db tokens create <name>`. A local file: URL has nothing to
      # authenticate to and ignores this; it exists for exactly this remote
      # case. Kept out of the file because it belongs to your Turso account
      # rather than to this checkout.
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # Which service to talk to — left blank by default, since AI is
      # opt-in (see env.ts). A deploy with this unset still works: product
      # understanding falls back to the rule-based reading of the page, and
      # the AI-only features (diagnosis, task recommendation, artifact
      # generation) simply refuse until it is set here *and* each account has
      # added its own key from /account. See the README's "AIを使えるように
      # する". No API key env var belongs in this blueprint any more — it is
      # per-account, not per-instance.
      - key: LLM_PROVIDER
        sync: false

      # Generated once by Render and kept, so a deploy does not sign everyone
      # out. Required, not optional, the moment this is not localhost:
      # src/proxy.ts refuses every non-local request with 503 until a signing
      # key exists, so without this the dashboard is unreachable by design.
      #
      # There is no admin password to set alongside it. The first person to
      # open the deployed URL registers the owner account, and everyone after
      # them needs an invitation from that account.
      - key: GRAPE_SESSION_SECRET
        generateValue: true

      # INGEST_BASE_URL is deliberately absent: Render publishes this service's
      # own address as RENDER_EXTERNAL_URL, and src/env.ts takes the ingest
      # origin from it. So the snippet on /settings is correct on the first
      # boot, with nothing to fill in and no window in which it points at
      # localhost. Set it here only for a custom domain — or from /settings,
      # which needs no redeploy because settings live in SQLite.

      # Anything but the exact string "false" keeps practice mode on. Stated
      # explicitly rather than left to the default, because this is now a
      # server that could post to a real X account unattended.
      - key: GRAPE_ACTION_DRY_RUN
        value: "true"
